<!DOCTYPE html>
<html lang="de" data-theme="system">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ioBroker Backup Analyzer</title>

    <!--
        Relative Angabe statt "/": So läuft die Seite in jedem Unterverzeichnis eines
        Apache, ohne dass hier etwas geändert werden muss. Wer sie unter
        http://iobroker/analyzer/ ablegt, lädt damit dieselben Dateien wie in der Wurzel.
    -->
    <base href="./" />

    <meta name="description" content="Wertet ein ioBroker-Backup im Browser aus. Die Datei bleibt dabei auf dem eigenen Rechner." />
    <meta name="robots" content="noindex" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div id="app">
    <div class="startbild">
        <div class="startbild-inhalt">
            <h1>ioBroker Backup Analyzer</h1>
            <p>Das Programm wird geladen …</p>
            <div class="balken"><div class="balken-lauf"></div></div>
            <p class="klein">
                Beim ersten Aufruf werden einige Megabyte übertragen. Danach liegt alles im
                Zwischenspeicher des Browsers, und der Start geht schnell.
            </p>
        </div>
    </div>
</div>

<!--
    Fällt die Laufzeit aus, zeigt Blazor sonst nur einen schmalen gelben Streifen mit
    englischem Text. Diese Fassung sagt auf Deutsch, was zu tun ist.
-->
<div id="blazor-error-ui">
    Es ist ein unerwarteter Fehler aufgetreten. Die Seite muss neu geladen werden.
    <a href="." class="neu-laden">Neu laden</a>
    <a class="dismiss">🗙</a>
</div>

<!--
    KEINE Weiterleitung zur Prüfseite mehr — und das ist eine Entscheidung, keine Lücke.

    Früher sah diese Seite beim ersten Aufruf nach, ob servertest.html danebenliegt, und
    schickte den Betrachter einmalig dorthin. Gut gemeint: Steht der Dateityp für .wasm
    falsch, bliebe hier sonst ein weißes Bild stehen.

    Drei Gründe sprachen dagegen, und sie wiegen schwerer:

    1. Sie erschien, wenn nichts kaputt war. Die Weiterleitung hing am ersten Aufruf, nicht
       am Fehlerfall — der Normalfall bekam eine Diagnoseseite vorgesetzt, die ihm
       bestätigte, dass alles stimmt.

    2. Sie erschien nicht dort, wo sie gebraucht wird. Eingerichtet wird eine Instanz
       einmal, benutzt wird sie danach von mehreren — und die Markierung lag im
       localStorage, also je Browser und nicht je Installation. Damit bekam jeder neue
       Betrachter eine Seite über Serverkonfiguration zu sehen, die zu seinem Anliegen
       nichts beiträgt. LIESMICH_Browser.txt führt in Schritt 3 ohnehin zur Prüfseite.

    3. Sie hat Vertrauen gekostet. Auf einem Server ohne Prüfseite (GitHub Pages) schrieb
       die Anfrage einen 404 in die Browserkonsole. Ein Anwender meldete ihn zusammen mit
       einem echten Fehler — für ihn sah beides gleich kaputt aus.

    Die Prüfseite bleibt liegen und lässt sich jederzeit aufrufen; die Anleitung nennt den
    Weg dorthin.
-->

<script src="js/app.js"></script>

<!--
    Blazor wird von Hand gestartet, nur um ihm die Anzeigekultur mitzugeben.

    WARUM DAS SEIN MUSS. Die Oberfläche ist durchgehend deutsch, und AppCulture stellt
    deshalb in allen drei Fassungen de-DE ein, damit „16.576" überall gleich aussieht (die
    Begründung steht dort). Auf einem Rechner ist das folgenlos. Im Browser gilt es als
    Kulturwechsel während des Starts — und Blazor lädt von sich aus nur die Kulturdaten,
    die der Browser selbst benutzt. Steht der auf Englisch, fehlen die deutschen Daten, und
    die Anwendung bricht beim Start ab:

        Blazor detected a change in the application's culture that is not supported
        with the current project configuration.

    Auf einem deutschen Rechner fällt das nie auf: Dort sind Browser- und Anwendungskultur
    dieselbe, also wechselt nichts. Gemeldet wurde es aus dem Forum, von einem Browser mit
    anderer Spracheinstellung.

    Mit applicationCulture startet Blazor gleich in de-DE und lädt die passenden Daten.
    Damit gibt es keinen Wechsel mehr, und AppCulture setzt anschliessend nur noch, was
    ohnehin schon gilt.

    Der naheliegende andere Weg wäre BlazorWebAssemblyLoadAllGlobalizationData im csproj —
    der lädt die Daten *aller* Kulturen. Das behebt es ebenfalls, kostet aber jeden
    Aufrufer zusätzliche Übertragung für Kulturen, die diese Anwendung nie braucht.
-->
<script src="_framework/blazor.webassembly.js" autostart="false"></script>
<script>
    Blazor.start({ applicationCulture: 'de-DE' });
</script>
</body>
</html>
